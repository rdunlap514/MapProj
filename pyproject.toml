[project]
name = "mapproj"
version = "0.1.0"
description = "Interactive floor plans and room status tracking for facilities teams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
