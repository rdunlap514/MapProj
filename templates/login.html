<!DOCTYPE html>
<html lang="en">
<head>
    {% include '_security.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapProj - Login</title>
    <link rel="icon" type="image/png" href="/api/logo">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #D4553F;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(255, 68, 68, 0.2);
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container-login {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
            height: 60px;
        }

        .logo-container-login img {
            max-height: 60px;
            max-width: 240px;
            object-fit: contain;
        }

        .logo-placeholder-login {
            height: 60px;
            width: 60px;
            background: rgba(212, 85, 63, 0.1);
            border: 2px solid #D4553F;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4553F;
            font-size: 32px;
        }

        .login-header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #D4553F, #E8A830);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            font-size: 13px;
            color: #d0d0d0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #ffd60a;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #0a0a0a;
            color: #f0f0f0;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #D4553F;
            background: #1a1a1a;
            box-shadow: 0 0 12px rgba(255, 68, 68, 0.3);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #D4553F, #E8A830);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 68, 68, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid #ff4757;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            color: #ff6b6b;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: #ffd60a;
            font-size: 13px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ffd60a;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #444;
        }

        .login-footer p {
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }

        .login-footer code {
            background: #0a0a0a;
            padding: 2px 6px;
            border-radius: 3px;
            color: #ffd60a;
            font-family: 'Courier New', monospace;
        }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-container-login" id="logoContainerLogin">
                <div class="logo-placeholder-login">🗺️</div>
            </div>
            <h1>MapProj</h1>
            <p>Room Status Coordination</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="error-message" id="errorMessage"></div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-button">
                <span id="loginText">Sign In</span>
                <span id="loadingSpinner" class="loading"><span class="spinner"></span>Signing in...</span>
            </button>
        </form>

        <div class="login-footer">
            <p>Please enter your credentials to access MapProj</p>
        </div>
    </div>

    <script>
        // Try optional local branding; the app still works when no logo file exists.
        function loadLogo() {
            const logoContainer = document.getElementById('logoContainerLogin');
            fetch('/api/logo')
                .then(response => {
                    if (response.ok) {
                        logoContainer.innerHTML = `<img src="/api/logo?t=${Date.now()}" alt="MapProj Logo" style="max-height: 60px; max-width: 240px; object-fit: contain;">`;
                    }
                })
                .catch(err => {
                    console.log('Logo not available:', err);
                });
        }

        // Stop the normal form submission and send credentials with fetch; Flask sets the session cookie.
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginText = document.getElementById('loginText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const submitButton = event.target.querySelector('button[type="submit"]');

            // Clear error
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            // Show loading
            loginText.style.display = 'none';
            loadingSpinner.style.display = 'block';
            submitButton.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Redirect based on role
                    const role = data.role;
                    if (role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/user';
                    }
                } else {
                    // Show error
                    errorMessage.textContent = data.error || 'Invalid credentials';
                    errorMessage.classList.add('show');
                    document.getElementById('password').value = '';
                }
            } catch (e) {
                errorMessage.textContent = 'Login failed: ' + e.message;
                errorMessage.classList.add('show');
            } finally {
                // Hide loading
                loginText.style.display = 'inline';
                loadingSpinner.style.display = 'none';
                submitButton.disabled = false;
            }
        }

        // Focus on username field
        document.getElementById('username').focus();

        // Load logo if it exists
        loadLogo();
    </script>
</body>
</html>
